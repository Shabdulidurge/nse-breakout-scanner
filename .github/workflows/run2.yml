name: NSE Value Scanner

on:
  schedule:
    - cron: '15 15 * * 1-5'   # Changed timing

  workflow_dispatch:

concurrency:
  group: excel-sheet-update
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Libraries
      run: pip install -r requirements.txt

    - name: Run Script
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: python value.py
