name: NSE Value DMA CAR Scanner

on:
  schedule:
    - cron: '25 15 * * 1-5'

  workflow_dispatch:

concurrency:
  group: excel-sheet-update
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - run: pip install -r requirements.txt

    - name: Run Script
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: python value_with_dma_car.py
